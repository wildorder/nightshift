name: CI

# A program branch is verified by its pull request, and `v1` by the push that
# merges it. Listing `program/**` under `push` as well ran every commit twice
# per OS once its PR was open.
on:
  push:
    branches:
      - v1
  pull_request:
    branches:
      - v1

# One run per ref. A new push supersedes an in-flight run rather than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both legs must pass, and a failure on one must not hide the result on the
      # other. The Windows leg runs the whole suite unchanged, but only on `v1`:
      # it takes three times as long (process creation and NTFS), and its job is
      # to prove the scripts and paths hold on Git Bash, which a merge does as
      # well as every push to a PR. A pull request is verified on Linux.
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A shallow clone is enough: the sterility check reads the tracked file
          # list at HEAD and never inspects history or another ref.
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Each gate is its own step so a red run names what failed without anyone
      # having to read the log. Order matters: synth needs the build (D-P1-10),
      # and typecheck resolves @nightshift/* through the built declarations.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The integration suites each spawn git, workers, MCP servers and the
      # verification runner. Windows creates processes and touches NTFS several
      # times slower than Linux, and the hosted runner has four cores: run all of
      # those suites at once and each starves, and a different one times out on
      # every push. Two workers keeps the Windows leg honest without hiding a
      # real failure; Linux is fast enough to run flat out.
      - name: Test
        run: npm test ${{ runner.os == 'Windows' && '-- --maxWorkers 2' || '' }}

      # No AWS credentials are configured anywhere in this workflow, and none are
      # needed: the P1 stack is environment-agnostic and defines no resources.
      # Adding a credentials step is a P2 change, not a convenience.
      - name: Synth
        run: npm run synth

      - name: Sterility
        run: npm run check:sterility
